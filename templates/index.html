<!DOCTYPE html>
<html>
<head>
    <title>Island Art Sprites</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        .sprite-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin: 20px 0;
        }
        img {
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1>Island Art Sprites</h1>

    <div class="sprite-container">
        <h2>Palm Tree Variations</h2>
        <img src="/palm_tree/1" alt="Palm Tree 1">
        <img src="/palm_tree/2" alt="Palm Tree 2">
        <img src="/palm_tree/3" alt="Palm Tree 3">
    </div>

    <div class="sprite-container">
        <h2>Shrubbery Variations</h2>
        <img src="/shrubbery/1" alt="Shrubbery 1">
        <img src="/shrubbery/2" alt="Shrubbery 2">
        <img src="/shrubbery/3" alt="Shrubbery 3">
    </div>

    <div class="sprite-container">
        <h2>Green Tree Variations</h2>
        <img src="/green_tree/1" alt="Green Tree 1">
        <img src="/green_tree/2" alt="Green Tree 2">
        <img src="/green_tree/3" alt="Green Tree 3">
    </div>
</body>
</html>
